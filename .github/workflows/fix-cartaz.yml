name: Corrigir cartaz JPEG

on:
  push:
    paths:
      - '.github/workflows/fix-cartaz.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Converter PNG para JPEG real
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick assets/cartaz-acesso.png -background white -alpha remove -alpha off -quality 90 assets/cartaz-acesso.jpg
          else
            convert assets/cartaz-acesso.png -background white -alpha remove -alpha off -quality 90 assets/cartaz-acesso.jpg
          fi
          file assets/cartaz-acesso.jpg

      - name: Salvar arquivo corrigido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cartaz-acesso.jpg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "fix: converte cartaz de acesso para JPEG real"
            git push
          fi
